name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          LDFLAGS: -X github.com/tamarackdb/tamarackdb/internal/buildinfo.Version=${{ github.ref_name }}
        run: |
          out="tamarackdb-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          mkdir -p "$out"
          go build -ldflags "$LDFLAGS" -o "$out/tamarackdb-server" ./cmd/tamarackdb-server
          go build -ldflags "$LDFLAGS" -o "$out/tamarackdb-migrate" ./cmd/tamarackdb-migrate
          go build -ldflags "$LDFLAGS" -o "$out/tamarackdb-init" ./cmd/tamarackdb-init
          go build -ldflags "$LDFLAGS" -o "$out/tamarackdb-backup" ./cmd/tamarackdb-backup
          zip -r "$out.zip" "$out"

      - uses: softprops/action-gh-release@v2
        with:
          files: tamarackdb-${{ github.ref_name }}-linux-${{ matrix.arch }}.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
